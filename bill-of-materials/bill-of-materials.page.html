<ion-header [translucent]="true">
	<app-toolbar [page]="this"></app-toolbar>
</ion-header>

<ion-content [fullscreen]="true" appScrollbarTheme class="left scrollx" forceOverscroll="false">
	<app-page-title class="ion-padding safe-max-width" [pageConfig]="pageConfig"></app-page-title>

	<div class="safe-max-width">
		<app-data-table
			class="box-shadow responsive"
			[rows]="items"
			[trackBy]="'Id'"
			[(selectedRows)]="selectedItems"
			[showSpinner]="pageConfig.showSpinner"
			[showFilter]="pageConfig.isShowSearch"
			[(query)]="query"
			(dataInfinite)="loadData($event)"
			(filter)="onDatatableFilter($event)"
			(sort)="onSort($event)"
			(selectedRowsChange)="showCommandBySelectedRows($event)"
		>
			<datatable-column [checkbox]="true" name=""></datatable-column>
			<datatable-column class="col-id" name="#" property="Id" [navLink]="pageConfig.pageName"></datatable-column>
			<datatable-column class="col-name" name="Finished goods with BOM" property="ItemName" [navLink]="pageConfig.pageName">
				<ng-template datatable-filter-template>
					<input [ngModelOptions]="{standalone: true}" [(ngModel)]="query.Keyword" class="c-input" [ngClass]="{active: query.Keyword}" type="text" />
					<ion-icon class="min-btn" (click)="query.Keyword=''; refresh()" *ngIf="query.Keyword" name="close-circle-outline"></ion-icon>
				</ng-template>
				<ng-template let-i="row" datatable-cell-template>
					<b>{{i._Item?.Code}}</b>
					<span>
						-
						<span> {{i._Item?.Name}} </span>
						<small *ngIf="i.Quantity"
							><b><ion-text color="primary">X {{i.Quantity}}</ion-text></b></small
						>
					</span>
				</ng-template>
			</datatable-column>
			<datatable-column class="col-number" name="Quantity/batch" property="BatchSize"></datatable-column>
			<datatable-column
				class="col-code"
				name="Classification"
				property="Type"
				filterControlType="ng-select"
				[filterDataSource]="typeList"
				filterBindValue="Code"
				filterBindLabel="Name"
			>
				<ng-template let-i="row" datatable-cell-template> {{i.TypeName}} </ng-template>
			</datatable-column>
		</app-data-table>
	</div>

	<div class="ion-padding"></div>
</ion-content>
