<ion-header [translucent]="true">
	<ion-toolbar class="no-padding">
		<ion-buttons slot="start" class="ion-hide-sm-down_">
			<ion-button color="dark" class="ion-hide-sm-down"> {{'Select products' | translate}} </ion-button>
		</ion-buttons>

		<ion-buttons slot="primary">
			<span class="split ion-hide-sm-down">|</span>

			<ion-button [disabled]="selectedItems.length==0" fill="solid" size="small" color="primary" (click)="saveSelectedProducts()">
				&nbsp;{{'Add' | translate}} {{selectedItems.length}} {{ (selectedItems.length === 1 ? 'product' : 'products') | translate }}&nbsp;
			</ion-button>

			<ion-button
				title="{{'Search' | translate}}"
				fill="clear"
				(click)="pageConfig.isShowSearch = !pageConfig.isShowSearch"
			>
				<ion-icon slot="icon-only" name="search-outline"></ion-icon>
			</ion-button>

			<ion-button (click)="refresh()" title="{{'Refresh' | translate}}">
				<ion-icon slot="icon-only" name="reload-outline"></ion-icon>
			</ion-button>

			<ion-button title="{{'Help' | translate}}" (click)="help()">
				<ion-icon slot="icon-only" name="help-circle-outline"></ion-icon>
			</ion-button>

			<ion-button title="{{'Close' | translate}}" color="secondary" (click)="closeModal()">
				<ion-icon slot="icon-only" name="close"></ion-icon>
			</ion-button>
		</ion-buttons>
	</ion-toolbar>
</ion-header>

<ion-content appScrollbarTheme class="header-table scrollx" forceOverscroll="false">
	<app-data-table
		class="box-shadow picker-product-table responsive"
		[virtualScroll]="true"
		[rows]="items"
		[trackBy]="'Id'"
		[(selectedRows)]="selectedItems"
		[showSpinner]="pageConfig.showSpinner"
		[showFilter]="pageConfig.isShowSearch"
		[(query)]="query"
		(dataInfinite)="loadData($event)"
		(filter)="onDatatableFilter($event)"
		(sort)="onSort($event)"
		(selectedRowsChange)="showCommandBySelectedRows($event)"
	>
		<datatable-empty-message
			message="No products found"
			subMessage="Try changing menu, id or keyword"
			[showImg]="false"
		></datatable-empty-message>
		<datatable-column [checkbox]="true" name="" [canFilter]="false">
			<ng-template datatable-header-template>
				<input
					class="c-checkbox"
					type="checkbox"
					[checked]="isAllSelected"
					(change)="toggleSelectAll($event)"
					[title]="'Select all' | translate"
				/>
			</ng-template>
		</datatable-column>
		<datatable-column class="col-id" name="#" property="Id"></datatable-column>
		<datatable-column class="col-code" name="Code" property="Code"></datatable-column>
		<datatable-column class="col-name picker-product-col flex-break" name="Product" property="Name">
			<ng-template datatable-filter-template>
				<div class="picker-product-filter">
					<input
						class="c-input picker-keyword-filter"
						type="text"
						[(ngModel)]="query.Keyword"
						[ngModelOptions]="{ standalone: true }"
						placeholder="{{ 'Type to search...' | translate }}"
						(keydown.enter)="submitSearch()"
					/>
					<div class="picker-menu-select" id="picker-menu-select-host">
						<ng-select
							class="c-input"
							[items]="menuTreeList"
							[formControl]="menuControl"
							[loading]="isMenuLoading"
							[multiple]="true"
							[searchFn]="searchMenuTree"
							[clearable]="true"
							[closeOnSelect]="false"
							[bindValue]="'MenuId'"
							appendTo="#picker-menu-select-host"
							placeholder="{{ 'All menus' | translate }}"
							(search)="onMenuTreeSearch($event)"
						>
							<ng-template ng-multi-label-tmp let-items="items" let-clear="clear">
								<div class="ng-value" *ngFor="let item of getVisibleMenuLabels(items)">
									<span class="ng-value-label">{{ item.Name || item.Code }}</span>
									<span class="ng-value-icon right" (click)="clear(item)" aria-hidden="true">x</span>
								</div>
								<div class="ng-value menu-label-more" *ngIf="hiddenMenuLabelCount > 0">
									<span class="ng-value-label">+{{ hiddenMenuLabelCount }}</span>
								</div>
							</ng-template>
							<ng-template ng-option-tmp let-item="item" let-search="searchTerm">
								<span class="hide-all" *ngIf="item.show === false"></span>
								<div
									class="menu-tree-option"
									*ngIf="item.show !== false"
									[class.is-branch]="item.isBranchNode"
									(mousedown)="$event.stopPropagation()"
									(click)="onMenuTreeOptionClick(item, $event)"
								>
									<span class="menu-tree-indent" *ngFor="let _ of item.levels; let i = index">
										<span *ngIf="i > 0"></span>
									</span>
									<button
										type="button"
										class="menu-tree-toggle"
										[class.is-placeholder]="!item.hasChildInSearchBox"
										[disabled]="!item.hasChildInSearchBox"
										(click)="toggleMenuTreeExpand(item, $event)"
									>
										<ion-icon
											[name]="item.hasChildInSearchBox ? (item.showdetail ? 'chevron-down-outline' : 'chevron-forward-outline') : null"
										></ion-icon>
									</button>
									<input
										type="checkbox"
										class="menu-tree-checkbox"
										[checked]="item._menuChecked"
										[indeterminate]="item._menuIndeterminate"
										(click)="toggleMenuTreeNode(item, $event)"
									/>
									<span [class.branch-name]="item.isBranchNode" [ngOptionHighlight]="search">{{ item.Name || item.Code }}</span>
								</div>
							</ng-template>
						</ng-select>
					</div>
				</div>
			</ng-template>
		</datatable-column>
		<datatable-column class="col-number picker-past-qty-col" name="Sold qty" property="PastQuantity">
			<ng-template datatable-filter-template>
				<div class="picker-past-qty-filter">
					<ion-icon
						class="min-btn clickable picker-past-qty-toggle"
						[color]="showPastQuantity ? 'primary' : 'medium'"
						[name]="showPastQuantity ? 'eye-outline' : 'eye-off-outline'"
						(click)="togglePastQuantity()"
						[title]="(showPastQuantity ? 'Hide sold quantity' : 'Show sold quantity') | translate"
					></ion-icon>
				</div>
			</ng-template>
			<ng-template let-i="row" datatable-cell-template>
				<span *ngIf="showPastQuantity">{{ i.PastQuantity | number: '1.0-2' }}</span>
			</ng-template>
		</datatable-column>
	</app-data-table>
</ion-content>
